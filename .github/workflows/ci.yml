name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        env:
          POSTGRES_URL: postgresql://dummy:dummy@localhost:5432/dummy
          GOOGLE_CLIENT_ID: dummy_client_id
          GOOGLE_CLIENT_SECRET: dummy_client_secret
          JWT_SECRET: dummy_jwt_secret
          REFRESH_TOKEN_SECRET: dummy_refresh_token_secret
          DATA_ENCRYPTION_KEY: dummy_data_encryption_key
          JWT_REFRESH_EXPIRES_IN_MS: 2592000000
          DB_SSL_REJECT_UNAUTHORIZED: false
          RATE_LIMIT_WINDOW_MS: 60000
          REDIS_URL: redis://127.0.0.1:6379
          CLIENT_URL: http://localhost:5173
          UPSTASH_REDIS_REST_URL: https://us1-redis.upstash.io/rest/v1/dummy
          UPSTASH_REDIS_REST_TOKEN: dummy_upstash_token
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: dummy_bucket
          STORAGE_REGION: us-east-1
          STORAGE_FORCE_PATH_STYLE: true 
          MINIO_ROOT_USER: dummy_minio_user
          MINIO_ROOT_PASSWORD: dummy_minio_password
          AWS_ACCESS_KEY_ID: dummy_aws_access_key_id
          AWS_SECRET_ACCESS_KEY: dummy_aws_secret_access_key
          INFERENCE_API_URL: https://dummy-inference-api.com
        run: pnpm test
